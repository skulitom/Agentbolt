name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      AGENTBOLT_CHANNEL: ci-windows
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Test (all crates)
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    runs-on: ubuntu-24.04
    env:
      AGENTBOLT_CHANNEL: ci-linux
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Core, IPC, daemon, MCP and packaging checks
        run: cargo test -p agentbolt-core -p agentbolt-ipc -p agentbolt-daemon -p agentbolt -p xtask --locked
      - name: Clippy
        run: cargo clippy -p agentbolt-core -p agentbolt-ipc -p agentbolt-daemon -p agentbolt -p xtask --all-targets --locked -- -D warnings

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
