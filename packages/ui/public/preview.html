<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentUI preview</title>

    <!-- Nonced because a strict script-src blocks inline scripts, and an
         external import map is impossible: `src` must not be specified on one. -->
    <script type="importmap" nonce="__NONCE__">
      {
        "imports": {
          "agentui": "/agentui/preview.js",
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>

    <style nonce="__NONCE__">
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: light-dark(#1c1c1a, #ececee);
        background: transparent;
        overflow: hidden;
      }
      #root { width: 100%; height: 100%; }
      #error {
        display: none; position: absolute; inset: auto 0 0 0;
        padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
        background: light-dark(#fceaea, #3a1c1c); color: light-dark(#a32d2d, #f09595);
        border-top: 1px solid light-dark(#f09595, #a32d2d);
        white-space: pre-wrap; max-height: 45%; overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <pre id="error"></pre>

    <script type="module" nonce="__NONCE__">
      // Bootstrap for agent-authored preview modules.
      //
      // Everything is wrapped so that a broken module degrades into a visible,
      // reportable error rather than a blank frame: the error goes to the parent,
      // which forwards it into the session event log, so the agent that wrote the
      // module sees its own stack trace and can fix it with ui_update.
      const params = new URLSearchParams(location.search);
      const sessionId = params.get("s") ?? "";
      const root = document.getElementById("root");
      const errorBox = document.getElementById("error");

      let mod = null;
      let lastValues = {};
      let frame = 0;

      // The frame has an opaque-free but still cross-origin relationship to the
      // parent; we post to "*" and the parent validates message shape instead.
      const post = (msg) => parent.postMessage(msg, "*");

      function showError(err, where) {
        const message = err && err.message ? err.message : String(err);
        const stack = err && err.stack ? String(err.stack) : undefined;
        errorBox.style.display = "block";
        errorBox.textContent = `${where}: ${message}\n\n${stack ?? ""}`.trim();
        post({ type: "preview_error", message: `${where}: ${message}`, stack });
      }

      function clearError() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      window.addEventListener("error", (e) => showError(e.error ?? e.message, "runtime"));
      window.addEventListener("unhandledrejection", (e) => showError(e.reason, "unhandled rejection"));

      async function load(spec, values) {
        lastValues = values ?? {};
        try {
          // Cache-busted so ui_update swaps the module without a page reload.
          const url = `/p/${encodeURIComponent(sessionId)}.mjs?r=${Date.now()}`;
          const imported = await import(url);
          mod = imported.default ?? imported;
          if (!mod || typeof mod.setup !== "function") {
            throw new Error("module must default-export an object with a setup() function");
          }
          root.replaceChildren();
          clearError();
          await mod.setup({
            container: root,
            spec,
            values: lastValues,
            emit: (name, data) => post({ type: "preview_event", name, data }),
          });
          if (typeof mod.update === "function") mod.update(lastValues);
          post({ type: "ready" });
        } catch (err) {
          mod = null;
          showError(err, "setup");
        }
      }

      // Drag frames arrive at pointer rate; coalesce to one update per animation
      // frame so a heavy scene cannot be flooded into stuttering.
      //
      // rAF alone is not enough: browsers pause it in hidden or non-compositing
      // tabs, so a preview in a background tab would silently stop tracking —
      // including values an agent pushes with ui_update. A timer races it, and
      // whichever fires first runs the update and cancels the other.
      let fallbackTimer = 0;

      function runUpdate() {
        if (frame) cancelAnimationFrame(frame);
        if (fallbackTimer) clearTimeout(fallbackTimer);
        frame = 0;
        fallbackTimer = 0;
        if (!mod || typeof mod.update !== "function") return;
        try {
          mod.update(lastValues);
        } catch (err) {
          showError(err, "update");
        }
      }

      function scheduleUpdate() {
        if (frame || fallbackTimer) return;
        frame = requestAnimationFrame(runUpdate);
        fallbackTimer = setTimeout(runUpdate, 100);
      }

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "init") {
          void load(msg.spec, msg.values);
        } else if (msg.type === "values") {
          lastValues = msg.values ?? {};
          scheduleUpdate();
        } else if (msg.type === "dispose") {
          try {
            mod?.dispose?.();
          } catch {
            /* disposal errors are not worth surfacing */
          }
        }
      });

      post({ type: "ready-for-init" });
    </script>
  </body>
</html>
