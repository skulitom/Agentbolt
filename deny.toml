# cargo-deny policy (PLAN.md: no copyleft in the binary). Run: cargo deny check licenses
#
# MPL-2.0 is the one copyleft licence allowed: it is weak, file-level copyleft (changes to MPL files stay MPL; our
# own code and the binary as a whole are not affected), and it comes in through option-ext (via dirs-sys).
# Strong copyleft is never allowed: no GPL, AGPL or LGPL of any version, with or without exceptions. Don't add
# them here; replace the dependency instead.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0", "OFL-1.1",
    "Ubuntu-font-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
ignore = []
