[package]
name = "agentbolt-desk"
description = "Agentbolt's Desk window and agentbolt:// handler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentbolt-core.workspace = true
agentbolt-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
time.workspace = true
tokio.workspace = true
eframe.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
