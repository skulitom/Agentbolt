[package]
name = "agentbolt-daemon"
description = "Agentbolt's daemon: the only writer of the store; owns the tray icon, toasts, delivery and the ntfy push"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentbolt-core.workspace = true
agentbolt-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
time.workspace = true
tokio.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
tauri-winrt-notification.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }
