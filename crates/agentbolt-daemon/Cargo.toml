[package]
name = "agentbolt-daemon"
description = "Agentbolt's daemon: the only writer of the store; owns the tray icon, toasts, delivery and the ntfy push"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentbolt-core.workspace = true
agentbolt-ipc.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
# Toasts are built as XML with the windows crate: tauri-winrt-notification 0.8 has no protocol-activated buttons.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Registry",
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
